<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AnatomyAR - Scanner</title>
  <meta name="theme-color" content="#0a0b10" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" />
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.3.0/dist/aframe-master.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
  <script src="js/organs.js"></script>
  <script src="js/ar-components.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; background: #000; }
    .ui { position: fixed; z-index: 10; color: #fff; }
    .topbar {
      top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; pointer-events: none;
      background: linear-gradient(180deg, rgba(0,0,0,.6), transparent);
    }
    .topbar a, .topbar button {
      pointer-events: auto; background: rgba(0,0,0,.55); color: #fff; border: 1px solid rgba(255,255,255,.15);
      text-decoration: none; padding: 9px 13px; border-radius: 11px; font-size: .9rem; font-weight: 600;
      backdrop-filter: blur(8px); cursor: pointer;
    }
    #hint {
      bottom: 22px; left: 50%; transform: translateX(-50%); text-align: center;
      padding: 12px 18px; max-width: 88vw; background: rgba(0,0,0,.6); border-radius: 14px;
      font-size: .95rem; backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.12);
    }
    #info {
      display: none; left: 50%; bottom: 22px; transform: translateX(-50%);
      width: min(420px, 90vw); background: rgba(12,13,19,.82); border: 1.5px solid #e63946;
      border-radius: 18px; padding: 15px 17px; backdrop-filter: blur(12px);
      box-shadow: 0 18px 50px rgba(0,0,0,.5);
    }
    .i-top { display: flex; align-items: center; gap: 12px; }
    .i-emoji { font-size: 1.9rem; }
    .i-name { font-size: 1.25rem; font-weight: 800; }
    .i-sys { font-size: .82rem; font-weight: 700; }
    .i-fact { color: #cfd5e2; font-size: .9rem; margin: 9px 0 6px; }
    .i-link { color: #ff6b6b; font-weight: 700; font-size: .9rem; text-decoration: none; }
    #cap {
      right: 14px; bottom: 96px; width: 56px; height: 56px; border-radius: 50%;
      background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.18); color: #fff;
      font-size: 1.4rem; cursor: pointer; backdrop-filter: blur(8px); display: none;
    }
    .flash { position: fixed; inset: 0; background: #fff; opacity: 0; z-index: 30; pointer-events: none; transition: opacity .35s; }
    .flash.go { opacity: .85; }
  </style>
</head>
<body>
  <div class="ui topbar">
    <a href="index.html">← Home</a>
    <a href="markers.html">🖨️ Scan cards</a>
  </div>
  <div class="ui" id="hint">📷 Point the camera at a scan card.<br>Pinch to zoom · drag to rotate.</div>
  <div class="ui" id="info"></div>
  <button class="ui" id="cap" title="Capture photo">📸</button>
  <div class="flash" id="flash"></div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    gesture-detector
    gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/v1/decoders/;"
    renderer="logarithmicDepthBuffer: true; colorManagement: true; sortObjects: true; alpha: true; antialias: true;"
    arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3; debugUIEnabled: false;">

    <a-entity light="type: ambient; intensity: 1.0"></a-entity>
    <a-entity light="type: directional; intensity: 0.6" position="1 2 1"></a-entity>

    <a-marker type="barcode" value="0" lazy-load="src: models/heart.glb" status="oid: heart">
      <a-entity gesture-handler><a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 16000; easing: linear"><a-entity data-model auto-fit="size: 1.2"></a-entity></a-entity></a-entity>
    </a-marker>
    <a-marker type="barcode" value="1" lazy-load="src: models/brain.glb" status="oid: brain">
      <a-entity gesture-handler><a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 16000; easing: linear"><a-entity data-model auto-fit="size: 1.2"></a-entity></a-entity></a-entity>
    </a-marker>
    <a-marker type="barcode" value="2" lazy-load="src: models/lungs.glb" status="oid: lungs">
      <a-entity gesture-handler><a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 16000; easing: linear"><a-entity data-model auto-fit="size: 1.2"></a-entity></a-entity></a-entity>
    </a-marker>
    <a-marker type="barcode" value="3" lazy-load="src: models/kidney.glb" status="oid: kidney">
      <a-entity gesture-handler><a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 16000; easing: linear"><a-entity data-model auto-fit="size: 1.2"></a-entity></a-entity></a-entity>
    </a-marker>
    <a-marker type="barcode" value="4" lazy-load="src: models/pelvis.glb" status="oid: pelvis">
      <a-entity gesture-handler><a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 16000; easing: linear"><a-entity data-model auto-fit="size: 1.2"></a-entity></a-entity></a-entity>
    </a-marker>
    <a-marker type="barcode" value="5" lazy-load="src: models/liver.glb" status="oid: liver">
      <a-entity gesture-handler><a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 16000; easing: linear"><a-entity data-model auto-fit="size: 1.2"></a-entity></a-entity></a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // Show capture button once the scene is ready.
    var scene = document.querySelector("a-scene");
    var cap = document.getElementById("cap");
    scene.addEventListener("loaded", function () { cap.style.display = "block"; });

    // Composite the camera video + the 3D canvas into one photo and download it.
    cap.addEventListener("click", function () {
      try {
        var video = document.querySelector("video");
        var glCanvas = scene.renderer.domElement;
        var w = glCanvas.width, h = glCanvas.height;
        var out = document.createElement("canvas");
        out.width = w; out.height = h;
        var ctx = out.getContext("2d");
        if (video) {
          // cover-fit the video into the canvas
          var vr = video.videoWidth / video.videoHeight, cr = w / h, dw, dh, dx, dy;
          if (vr > cr) { dh = h; dw = h * vr; dx = (w - dw) / 2; dy = 0; }
          else { dw = w; dh = w / vr; dx = 0; dy = (h - dh) / 2; }
          ctx.drawImage(video, dx, dy, dw, dh);
        }
        ctx.drawImage(glCanvas, 0, 0, w, h);
        var flash = document.getElementById("flash");
        flash.classList.add("go"); setTimeout(function () { flash.classList.remove("go"); }, 350);
        var a = document.createElement("a");
        a.download = "AnatomyAR-capture.png";
        a.href = out.toDataURL("image/png");
        a.click();
      } catch (e) { alert("Could not capture: " + e.message); }
    });
  </script>
</body>
</html>
